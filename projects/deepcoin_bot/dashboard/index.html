<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딥코인봇 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  h1 { font-size: 1.4rem; color: #58a6ff; margin-bottom: 4px; }
  .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  .regime-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .bull   { background: #1a4731; color: #3fb950; border: 1px solid #3fb950; }
  .bear   { background: #3d1c1c; color: #f85149; border: 1px solid #f85149; }
  .ranging{ background: #2a2a1a; color: #d29922; border: 1px solid #d29922; }
  .unknown{ background: #21262d; color: #8b949e; border: 1px solid #30363d; }
  .asset-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; }
  .asset-row:last-child { border-bottom: none; }
  .asset-name { font-weight: 600; font-size: 0.95rem; }
  .price { color: #8b949e; font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: left; padding: 8px 10px; color: #8b949e; border-bottom: 1px solid #30363d; font-weight: 500; }
  td { padding: 7px 10px; border-bottom: 1px solid #21262d; }
  tr:last-child td { border-bottom: none; }
  .wr-high { color: #3fb950; font-weight: 600; }
  .wr-med  { color: #d29922; }
  .wr-low  { color: #f85149; }
  .weight-chip { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .w-high { background: #1a4731; color: #3fb950; }
  .w-med  { background: #2a2a1a; color: #d29922; }
  .w-low  { background: #3d1c1c; color: #f85149; }
  .rec-list { list-style: none; }
  .rec-list li { padding: 10px 0; border-bottom: 1px solid #21262d; }
  .rec-list li:last-child { border-bottom: none; }
  .rec-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; margin-right: 8px; }
  .GO_LONG  { background: #1a4731; color: #3fb950; }
  .GO_SHORT { background: #3d1c1c; color: #f85149; }
  .CAUTION  { background: #2a2a1a; color: #d29922; }
  .RETIRE   { background: #3d1c1c; color: #f85149; }
  .PROMOTE  { background: #1c2d40; color: #58a6ff; }
  .MIXED    { background: #21262d; color: #8b949e; }
  .rec-reason { font-size: 0.82rem; color: #e6edf3; }
  .rec-action { font-size: 0.78rem; color: #8b949e; margin-top: 3px; }
  .idea-card { background: #1c2d40; border: 1px solid #1f6feb; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .idea-name { color: #58a6ff; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
  .idea-desc { font-size: 0.82rem; color: #e6edf3; margin-bottom: 4px; }
  .idea-basis { font-size: 0.78rem; color: #8b949e; }
  .summary-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 18px; }
  .stat-val { font-size: 1.6rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: #8b949e; }
  .refresh-btn { background: #1f6feb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 20px; }
  .refresh-btn:hover { background: #388bfd; }
  .loading { color: #8b949e; font-size: 0.9rem; padding: 20px; text-align: center; }
  .error { color: #f85149; font-size: 0.85rem; padding: 10px; }
  .section-title { font-size: 1.1rem; color: #e6edf3; margin: 24px 0 12px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; border: 1px solid #30363d; background: #21262d; color: #8b949e; }
  .tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
  <h1>🤖 딥코인봇 전략 대시보드</h1>
  <button class="refresh-btn" onclick="loadData()">새로고침</button>
</div>
<div class="subtitle" id="generated-at">데이터 로딩 중...</div>

<div id="summary-bar" class="summary-bar"></div>

<div class="section-title">📊 시장 국면</div>
<div id="regimes-grid" class="grid loading">로딩 중...</div>

<div class="section-title">⚡ 추천 액션</div>
<div class="card">
  <ul id="recommendations" class="rec-list"><li class="loading">로딩 중...</li></ul>
</div>

<div class="section-title">📈 전략 성과 & 가중치</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('all')">전체</div>
  <div class="tab" onclick="switchTab('elite')">엘리트 ⭐</div>
  <div class="tab" onclick="switchTab('watch')">관찰 👀</div>
  <div class="tab" onclick="switchTab('retire')">폐기 🚫</div>
</div>
<div class="card">
  <div id="tab-all" class="tab-content active"><table id="table-all"></table></div>
  <div id="tab-elite" class="tab-content"><table id="table-elite"></table></div>
  <div id="tab-watch" class="tab-content"><table id="table-watch"></table></div>
  <div id="tab-retire" class="tab-content"><table id="table-retire"></table></div>
</div>

<div class="section-title">💡 신규 전략 아이디어</div>
<div id="ideas"></div>

<script>
let currentData = null;

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['all','elite','watch','retire'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function wrClass(wr) {
  if (wr >= 45) return 'wr-high';
  if (wr >= 30) return 'wr-med';
  return 'wr-low';
}

function weightClass(w) {
  if (w >= 1.5) return 'w-high';
  if (w >= 0.75) return 'w-med';
  return 'w-low';
}

function buildTable(tableId, rows) {
  const t = document.getElementById(tableId);
  if (!rows || rows.length === 0) { t.innerHTML = '<tr><td style="color:#8b949e;padding:20px">데이터 없음</td></tr>'; return; }
  t.innerHTML = `<thead><tr>
    <th>패턴 키</th><th>거래수</th><th>승률</th><th>가중치</th>
  </tr></thead><tbody>` +
  rows.map(r => `<tr>
    <td style="font-family:monospace;font-size:0.78rem">${r.key}</td>
    <td>${r.total}</td>
    <td class="${wrClass(r.win_rate)}">${r.win_rate.toFixed(1)}%</td>
    <td><span class="weight-chip ${weightClass(r.weight)}">${r.weight.toFixed(2)}x</span></td>
  </tr>`).join('') + '</tbody>';
}

function buildAllTable(all) {
  const rows = Object.entries(all).map(([key, v]) => ({
    key, total: v.total, win_rate: v.win_rate, weight: v.weight
  })).sort((a, b) => b.win_rate - a.win_rate);
  buildTable('table-all', rows);
}

async function loadData() {
  document.getElementById('generated-at').textContent = '데이터 로딩 중...';

  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw new Error('data.json 없음 — python evolution/dashboard_gen.py 먼저 실행');
    const data = await r.json();
    currentData = data;
    render(data);
  } catch(e) {
    document.getElementById('generated-at').textContent = '';
    document.getElementById('regimes-grid').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

function render(data) {
  document.getElementById('generated-at').textContent = '업데이트: ' + data.generated_at;

  // Summary
  const s = data.summary;
  document.getElementById('summary-bar').innerHTML = `
    <div class="stat-box"><div class="stat-val">${s.total_patterns}</div><div class="stat-label">전체 패턴</div></div>
    <div class="stat-box"><div class="stat-val" style="color:#3fb950">${s.elite_count}</div><div class="stat-label">엘리트 (WR≥45%)</div></div>
    <div class="stat-box"><div class="stat-val" style="color:#d29922">${s.watch_count}</div><div class="stat-label">관찰 필요</div></div>
    <div class="stat-box"><div class="stat-val" style="color:#f85149">${s.retire_count}</div><div class="stat-label">폐기 권고</div></div>
  `;

  // Regimes
  const regGrid = document.getElementById('regimes-grid');
  regGrid.className = 'grid';
  regGrid.innerHTML = Object.entries(data.regimes).map(([sym, info]) => {
    const ticker = sym.split('-')[0];
    const regime = info.regime;
    const price = info.price ? Number(info.price).toLocaleString() : '?';
    const regimeKo = {bull:'상승장🟢', bear:'하락장🔴', ranging:'횡보장🟡', unknown:'알 수 없음'}[regime] || regime;
    const h1Ko = {bullish:'상승↑', bearish:'하락↓', neutral:'중립→'}[info.h1_trend] || info.h1_trend;
    return `<div class="card">
      <h2>${ticker}</h2>
      <div class="asset-row">
        <span class="asset-name">현재가</span>
        <span class="price">$${price}</span>
      </div>
      <div class="asset-row">
        <span>일봉 국면</span>
        <span class="regime-badge ${regime}">${regimeKo}</span>
      </div>
      <div class="asset-row">
        <span>1H 추세</span>
        <span style="font-weight:600">${h1Ko}</span>
      </div>
    </div>`;
  }).join('');

  // Recommendations
  document.getElementById('recommendations').innerHTML = data.recommendations.map(r => `
    <li>
      <span class="rec-type ${r.type}">${r.type}</span>
      <span class="rec-reason">${r.reason}</span>
      <div class="rec-action">→ ${r.action}</div>
    </li>
  `).join('');

  // Tables
  buildAllTable(data.weights.all);
  buildTable('table-elite', data.weights.elite);
  buildTable('table-watch', data.weights.watch);
  buildTable('table-retire', data.weights.retire);

  // Ideas
  document.getElementById('ideas').innerHTML = data.new_strategy_ideas.map(i => `
    <div class="idea-card">
      <div class="idea-name">💡 ${i.name}</div>
      <div class="idea-desc">${i.desc}</div>
      <div class="idea-basis">${i.basis}</div>
    </div>
  `).join('') || '<div class="card" style="color:#8b949e">현재 신규 제안 없음</div>';
}

loadData();
setInterval(loadData, 60000); // 1분마다 자동 새로고침
</script>
</body>
</html>
