name: Claude Code 트렌드 모니터 & 컨텐츠 생성

on:
  schedule:
    # 매주 월요일 오전 9시 KST = UTC 월요일 00:00
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  monitor-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 결과 파일 커밋용

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install requests anthropic

      - name: GitHub 트렌드 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Actions 기본 제공
        run: python projects/claude-code-monitor/monitor.py

      - name: 블로그 + 인스타 컨텐츠 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python projects/claude-code-monitor/generate_content.py

      - name: 결과 파일 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/
          git diff --staged --quiet || git commit -m "chore: Claude Code 트렌드 리포트 자동 생성 $(date +%Y-%m-%d)"
          git push

      - name: Slack 보고 (#성과보고, Bot Token)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_STAFF1_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python projects/claude-code-monitor/slack_notify.py
