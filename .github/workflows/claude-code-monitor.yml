name: Claude Code 트렌드 모니터 & 컨텐츠 생성

on:
  schedule:
    # 매일 오전 9시 7분 KST = UTC 00:07 (정각은 Actions 스케줄이 몰려 지연되기 쉬워 7분으로)
    # 주간 키워드 감시 리스트 점검은 monitor.py가 월요일(KST)에 자동으로 포함한다.
    - cron: '7 0 * * *'
  workflow_dispatch:  # 수동 실행 버튼
    inputs:
      watchlist:
        description: '요일과 무관하게 주간 키워드 감시 리스트 점검 포함'
        type: boolean
        default: false
      skip_content:
        description: '블로그·인스타 생성(Anthropic API) 건너뛰기'
        type: boolean
        default: false

concurrency:
  group: claude-code-monitor
  cancel-in-progress: false

jobs:
  monitor-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 결과 파일 커밋용

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install requests anthropic "langfuse>=4,<5" opentelemetry-instrumentation-anthropic

      - name: 소식 수집 (공식·GitHub·커뮤니티)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Actions 기본 제공
        # 소스 일부가 실패해도 리포트에 '수집 실패'로 적고 계속 진행한다 (monitor.py가 0으로 종료)
        run: python projects/claude-code-monitor/monitor.py ${{ inputs.watchlist && '--watchlist' || '' }}

      - name: 블로그 + 인스타 컨텐츠 생성
        if: ${{ !inputs.skip_content }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Langfuse 트레이싱 (Secrets 미설정 시 자동으로 꺼짐)
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_TRACING_ENVIRONMENT: production
          LANGFUSE_RELEASE: ${{ github.sha }}
        run: python projects/claude-code-monitor/generate_content.py

      - name: 결과 파일 커밋 & 푸시
        # research/ = 리포트 + research/state/(중복 제거·스타 이력 상태). 상태를 커밋해야 다음 실행이 '새 소식'을 구분한다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/
          git diff --staged --quiet && exit 0
          git commit -m "chore: Claude Code 트렌드 리포트 자동 생성 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Slack 보고 (#성과보고, Bot Token)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_STAFF1_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python projects/claude-code-monitor/slack_notify.py
