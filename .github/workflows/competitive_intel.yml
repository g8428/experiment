name: 경쟁사 인텔리전스 에이전트

on:
  schedule:
    # 평일(월~금) 오전 8:30 KST = UTC 전날 23:30
    # (월요일 KST = 일요일 UTC → cron 요일 0-4)
    - cron: '30 23 * * 0-4'

  # 수동 실행 (테스트용)
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install \
            apify-client \
            anthropic \
            gspread \
            google-auth

      - name: 에이전트 실행
        env:
          APIFY_API_TOKEN:    ${{ secrets.APIFY_API_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python competitive_intel_agent.py
